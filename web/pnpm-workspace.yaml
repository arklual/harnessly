# Native builds of the local speech model's server-side dependencies are not needed: the page runs it in the browser.
allowBuilds:
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# @tailwindcss/typography 0.5.20 pins postcss-selector-parser 6.0.10 (quadratic parsing, GHSA fixed in 6.1.5).
overrides:
  postcss-selector-parser@<6.1.5: ^6.1.5
