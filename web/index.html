<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <base href="/" />
    <meta name="api-base" content="" />
    <meta name="platform-api" content="/api/platform" />
    <meta name="hl-config" content="{}" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="harnessly" />
    <meta name="color-scheme" content="light dark" />
    <title>harnessly</title>
    <script>
      // The stored theme before the first paint, so a dark page does not flash light.
      try {
        var m = localStorage.getItem('hl-theme');
        var d =
          m === 'dark' || ((!m || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app/main.tsx"></script>
  </body>
</html>
