# golangci-lint v2. The standard linters plus a few that catch real mistakes; style linters that would mostly fight
# deliberate choices are left off, and every rule turned off below says why.
version: "2"

run:
  timeout: 10m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - asciicheck
    - copyloopvar
    - durationcheck
    - misspell
    - nolintlint
  settings:
    errcheck:
      exclude-functions:
        # coder/websocket: CloseNow is the abrupt close after a failure or in a defer; there is nothing left to do
        # with its error.
        - (*github.com/coder/websocket.Conn).CloseNow
    staticcheck:
      checks:
        - all
        # Off by default in golangci-lint: package comments, initialisms, receiver names, doc comment forms.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Many error texts are the previous runtime's messages, returned to callers byte for byte.
        - -ST1005
        # `var v any = undefined` spells out that a value holds any JavaScript value.
        - -ST1023
        # Quick fixes are refactoring suggestions, not findings.
        - -QF*
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests call the same method twice on purpose (`Claim(x) || Claim(x)`) to check that it is idempotent.
      - path: _test\.go
        linters: [staticcheck]
        text: "SA4000:"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
