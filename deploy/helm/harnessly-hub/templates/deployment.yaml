{{- include "hub.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hub.fullname" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
spec:
  {{- if include "hub.multi" . }}
  # Several replicas on a shared Postgres: a machine's link has an owner with a lease and a fencing token in the
  # database, and a request reaches the owner over the replicas' internal hop (docs/hub/replicas.md).
  replicas: {{ int .Values.replicaCount }}
  {{- else }}
  # One replica: a second hub on the same SQLite file would corrupt it, and without a shared database the agent links
  # live in this process only.
  replicas: 1
  {{- end }}
  strategy:
    {{- if eq (include "hub.strategy" .) "RollingUpdate" }}
    # Rolled one at a time and never below the count: a new pod is ready before an old one is told to stop, and the
    # old one moves its machines away before it goes (drain below).
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: {{ .Values.strategy.maxSurge }}
    {{- else }}
    # Replaced and not rolled: the old pod is gone before the new one starts.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        # The convention of a Prometheus that finds pods by annotation; one that uses ServiceMonitors ignores them.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hub.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hub.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ include "hub.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8040
              protocol: TCP
            {{- if include "hub.multi" . }}
            - name: replica
              containerPort: 8041
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            # The release the hub says it is: the image's tag (internal/hub/buildinfo).
            - name: HUB_VERSION
              value: {{ include "hub.imageTag" . | quote }}
            - name: HUB_PUBLIC_URL
              value: {{ include "hub.publicUrl" . | quote }}
            - name: HUB_LISTEN
              value: "0.0.0.0:8040"
            - name: HUB_DATA_DIR
              value: /var/lib/harnessly-hub
            - name: HUB_SIGNUP
              value: {{ .Values.signup | quote }}
            - name: HUB_ORGS
              value: {{ .Values.orgs | quote }}
            {{- with .Values.featuresDefault }}
            - name: HUB_FEATURES_DEFAULT
              value: {{ join "," . | quote }}
            {{- end }}
            - name: HUB_MACHINE_TRUST
              value: {{ ternary "on" "off" .Values.machineTrust | quote }}
            {{- if .Values.oidcEmailTrusted }}
            - name: HUB_OIDC_EMAIL_TRUSTED
              value: "on"
            {{- end }}
            - name: HUB_EDITION
              value: {{ .Values.edition | quote }}
            - name: HUB_PASSKEY
              value: {{ ternary "on" "off" .Values.passkey | quote }}
            - name: HUB_SSH
              value: {{ ternary "on" "off" .Values.ssh | quote }}
            - name: HUB_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.trustedProxies }}
            - name: HUB_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.sshAllowPrivate (ne .Values.edition "cloud") }}
            - name: HUB_SSH_ALLOW_PRIVATE
              value: "on"
            {{- end }}
            {{- with .Values.adminEmails }}
            - name: HUB_ADMIN_EMAILS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.runtimeDomain }}
            - name: HUB_RUNTIME_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sitesDomain }}
            - name: HARNESSLY_SITES_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.sites.enabled }}
            - name: HARNESSLY_SITES
              value: "off"
            {{- end }}
            {{- with .Values.sites.abuseUrl }}
            - name: HARNESSLY_SITES_ABUSE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sites.s3 }}
            {{- if .endpoint }}
            - name: HARNESSLY_SITES_S3_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: HARNESSLY_SITES_S3_BUCKET
              value: {{ required "sites.s3.bucket is required with sites.s3.endpoint" .bucket | quote }}
            {{- with .region }}
            - name: HARNESSLY_SITES_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .prefix }}
            - name: HARNESSLY_SITES_S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.rpId }}
            - name: HUB_RP_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mailFrom }}
            - name: HUB_MAIL_FROM
              value: {{ . | quote }}
            {{- end }}
            {{- if eq (.Values.authEmail | default "on") "off" }}
            - name: HUB_AUTH_EMAIL
              value: "off"
            {{- end }}
            {{- with .Values.storage }}
            {{- if eq .type "s3" }}
            - name: HUB_STORAGE
              value: "s3"
            - name: HUB_S3_ENDPOINT
              value: {{ required "storage.s3.endpoint is required with storage.type=s3" .s3.endpoint | quote }}
            - name: HUB_S3_BUCKET
              value: {{ required "storage.s3.bucket is required with storage.type=s3" .s3.bucket | quote }}
            {{- with .s3.region }}
            - name: HUB_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .s3.prefix }}
            - name: HUB_S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.containerImage }}
            - name: HUB_CONTAINER_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.minAgentVersion }}
            - name: HUB_MIN_AGENT_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.termsUrl }}
            - name: HUB_TERMS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.github.clientId }}
            - name: HUB_GITHUB_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.github.url }}
            - name: HUB_GITHUB_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.yandex.clientId }}
            - name: HUB_YANDEX_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.oidc }}
            {{- $ids := list }}
            {{- range .Values.oidc }}
            {{- $ids = append $ids (required "oidc: id is required" .id) }}
            {{- end }}
            - name: HUB_OIDC_PROVIDERS
              value: {{ join "," $ids | quote }}
            {{- end }}
            {{- range .Values.oidc }}
            {{- $prefix := printf "HUB_OIDC_%s_" (upper .id) }}
            - name: {{ $prefix }}ISSUER
              value: {{ required "oidc: issuer is required" .issuer | quote }}
            - name: {{ $prefix }}CLIENT_ID
              value: {{ required "oidc: clientId is required" .clientId | quote }}
            {{- with .name }}
            - name: {{ $prefix }}NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.database.postgres.enabled }}
            # Defined before HUB_DATABASE_URL: Kubernetes expands $(NAME) from the variables above it.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.postgresSecretName" . }}
                  key: password
            - name: HUB_DATABASE_URL
              value: "postgres://harnessly:$(POSTGRES_PASSWORD)@{{ include "hub.postgresName" . }}:5432/harnessly?sslmode=disable"
            {{- end }}
            {{- if .Values.metrics.enabled }}
            # A listener of its own: /metrics is served without sign-in and is on no Service and no Ingress.
            - name: HUB_METRICS_LISTEN
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            {{- end }}
            {{- if include "hub.multi" . }}
            - name: HUB_REPLICAS
              value: "on"
            # A stop: not ready for drain.settleSeconds, then the machines are asked to dial again over
            # drain.linksSeconds, and the rest of the grace is for the requests under way.
            - name: HUB_SHUTDOWN_GRACE
              value: "{{ include "hub.shutdownGrace" . }}s"
            - name: HUB_DRAIN_SETTLE
              value: "{{ int .Values.drain.settleSeconds }}s"
            - name: HUB_DRAIN_LINKS
              value: "{{ int .Values.drain.linksSeconds }}s"
            # Defined before HUB_REPLICA_ADDR: Kubernetes expands $(NAME) from the variables above it.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HUB_REPLICA_LISTEN
              value: "0.0.0.0:8041"
            - name: HUB_REPLICA_ADDR
              value: "http://$(POD_IP):8041"
            - name: HUB_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HUB_REPLICA_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.replicaSecretName" . }}
                  key: secret
            {{- end }}
            {{- if .Values.docs.enabled }}
            - name: HUB_DOCS
              value: "on"
            # The hub calls a bundled service in the cluster; machines and browsers get the public address.
            - name: HUB_ARTIFACTS_URL
              value: {{ ternary (printf "http://%s-artifacts:8080" (include "hub.fullname" .)) (.Values.docs.url | trimSuffix "/") .Values.docs.bundled | quote }}
            - name: HUB_ARTIFACTS_PUBLIC_URL
              value: {{ .Values.docs.url | trimSuffix "/" | quote }}
            - name: HUB_ARTIFACTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.appSecretName" (dict "root" . "key" "docs") }}
                  key: token
            {{- if eq .Values.docs.auth "harnessly" }}
            - name: HUB_ARTIFACTS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.appSecretName" (dict "root" . "key" "docs") }}
                  key: accessToken
            {{- end }}
            {{- end }}
            {{- if .Values.boards.enabled }}
            # The hub calls a bundled service in the cluster; machines and browsers get the public address.
            - name: HUB_BOARDS_URL
              value: {{ ternary (printf "http://%s-boards:8080" (include "hub.fullname" .)) (.Values.boards.url | trimSuffix "/") .Values.boards.bundled | quote }}
            - name: HUB_BOARDS_PUBLIC_URL
              value: {{ .Values.boards.url | trimSuffix "/" | quote }}
            - name: HUB_BOARDS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.appSecretName" (dict "root" . "key" "boards") }}
                  key: token
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "hub.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.preStop }}
          lifecycle:
            preStop:
              {{- toYaml . | nindent 14 }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/harnessly-hub
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if and .Values.persistence.enabled (not (include "hub.multi" .)) }}
          persistentVolumeClaim:
            claimName: {{ include "hub.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "hub.affinity" . | trim) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
