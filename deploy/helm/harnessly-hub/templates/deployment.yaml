{{- include "hub.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hub.fullname" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
spec:
  {{- if include "hub.multi" . }}
  # Several replicas on a shared Postgres, rolled one at a time: a machine's link has an owner with a lease and a
  # fencing token in the database, and a request reaches the owner over the replicas' internal hop (docs/hub/replicas.md).
  replicas: {{ int .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- else }}
  # One replica, replaced and not rolled: a second hub on the same SQLite file would corrupt it, and without a shared
  # database the agent links live in this process only.
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hub.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hub.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ include "hub.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8040
              protocol: TCP
          env:
            - name: HUB_PUBLIC_URL
              value: {{ include "hub.publicUrl" . | quote }}
            - name: HUB_LISTEN
              value: "0.0.0.0:8040"
            - name: HUB_DATA_DIR
              value: /var/lib/harnessly-hub
            - name: HUB_SIGNUP
              value: {{ .Values.signup | quote }}
            - name: HUB_ORGS
              value: {{ .Values.orgs | quote }}
            {{- with .Values.featuresDefault }}
            - name: HUB_FEATURES_DEFAULT
              value: {{ join "," . | quote }}
            {{- end }}
            - name: HUB_MACHINE_TRUST
              value: {{ ternary "on" "off" .Values.machineTrust | quote }}
            {{- if .Values.oidcEmailTrusted }}
            - name: HUB_OIDC_EMAIL_TRUSTED
              value: "on"
            {{- end }}
            - name: HUB_EDITION
              value: {{ .Values.edition | quote }}
            - name: HUB_PASSKEY
              value: {{ ternary "on" "off" .Values.passkey | quote }}
            - name: HUB_SSH
              value: {{ ternary "on" "off" .Values.ssh | quote }}
            - name: HUB_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.trustedProxies }}
            - name: HUB_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.sshAllowPrivate (ne .Values.edition "cloud") }}
            - name: HUB_SSH_ALLOW_PRIVATE
              value: "on"
            {{- end }}
            {{- with .Values.adminEmails }}
            - name: HUB_ADMIN_EMAILS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.runtimeDomain }}
            - name: HUB_RUNTIME_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sitesDomain }}
            - name: HARNESSLY_SITES_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.sites.enabled }}
            - name: HARNESSLY_SITES
              value: "off"
            {{- end }}
            {{- with .Values.sites.abuseUrl }}
            - name: HARNESSLY_SITES_ABUSE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sites.s3 }}
            {{- if .endpoint }}
            - name: HARNESSLY_SITES_S3_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: HARNESSLY_SITES_S3_BUCKET
              value: {{ required "sites.s3.bucket is required with sites.s3.endpoint" .bucket | quote }}
            {{- with .region }}
            - name: HARNESSLY_SITES_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .prefix }}
            - name: HARNESSLY_SITES_S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.rpId }}
            - name: HUB_RP_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mailFrom }}
            - name: HUB_MAIL_FROM
              value: {{ . | quote }}
            {{- end }}
            {{- if eq (.Values.authEmail | default "on") "off" }}
            - name: HUB_AUTH_EMAIL
              value: "off"
            {{- end }}
            {{- with .Values.storage }}
            {{- if eq .type "s3" }}
            - name: HUB_STORAGE
              value: "s3"
            - name: HUB_S3_ENDPOINT
              value: {{ required "storage.s3.endpoint is required with storage.type=s3" .s3.endpoint | quote }}
            - name: HUB_S3_BUCKET
              value: {{ required "storage.s3.bucket is required with storage.type=s3" .s3.bucket | quote }}
            {{- with .s3.region }}
            - name: HUB_S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .s3.prefix }}
            - name: HUB_S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.containerImage }}
            - name: HUB_CONTAINER_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.minAgentVersion }}
            - name: HUB_MIN_AGENT_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.termsUrl }}
            - name: HUB_TERMS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.github.clientId }}
            - name: HUB_GITHUB_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.github.url }}
            - name: HUB_GITHUB_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.yandex.clientId }}
            - name: HUB_YANDEX_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.oidc }}
            {{- $ids := list }}
            {{- range .Values.oidc }}
            {{- $ids = append $ids (required "oidc: id is required" .id) }}
            {{- end }}
            - name: HUB_OIDC_PROVIDERS
              value: {{ join "," $ids | quote }}
            {{- end }}
            {{- range .Values.oidc }}
            {{- $prefix := printf "HUB_OIDC_%s_" (upper .id) }}
            - name: {{ $prefix }}ISSUER
              value: {{ required "oidc: issuer is required" .issuer | quote }}
            - name: {{ $prefix }}CLIENT_ID
              value: {{ required "oidc: clientId is required" .clientId | quote }}
            {{- with .name }}
            - name: {{ $prefix }}NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.database.postgres.enabled }}
            # Defined before HUB_DATABASE_URL: Kubernetes expands $(NAME) from the variables above it.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.postgresSecretName" . }}
                  key: password
            - name: HUB_DATABASE_URL
              value: "postgres://harnessly:$(POSTGRES_PASSWORD)@{{ include "hub.postgresName" . }}:5432/harnessly?sslmode=disable"
            {{- end }}
            {{- if include "hub.multi" . }}
            - name: HUB_REPLICAS
              value: "on"
            # Defined before HUB_REPLICA_ADDR: Kubernetes expands $(NAME) from the variables above it.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HUB_REPLICA_ADDR
              value: "http://$(POD_IP):8040"
            - name: HUB_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HUB_REPLICA_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.replicaSecretName" . }}
                  key: secret
            {{- end }}
            {{- if .Values.docs.enabled }}
            - name: HUB_DOCS
              value: "on"
            - name: HUB_DOCS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.docsSecretName" . }}
                  key: token
            - name: HUB_ARTIFACTS_URL
              value: {{ include "hub.artifactsURL" . | quote }}
            - name: HUB_ARTIFACTS_TOKEN
              value: "$(HUB_DOCS_TOKEN)"
            {{- with (include "hub.boardsURL" .) }}
            - name: HUB_BOARDS_URL
              value: {{ . | quote }}
            - name: HUB_BOARDS_TOKEN
              value: "$(HUB_DOCS_TOKEN)"
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "hub.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/harnessly-hub
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if and .Values.persistence.enabled (not (include "hub.multi" .)) }}
          persistentVolumeClaim:
            claimName: {{ include "hub.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
