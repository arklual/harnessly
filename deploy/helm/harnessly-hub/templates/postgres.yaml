{{- if .Values.database.postgres.enabled }}
{{- $pg := .Values.database.postgres }}
{{- if not $pg.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.postgresName" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Kept across upgrades: the value, else what is already there, else a new one (letters and digits only, it goes into a URL). */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "hub.postgresName" .) }}
  {{- if $pg.password }}
  password: {{ $pg.password | quote }}
  {{- else if and $existing $existing.data (hasKey $existing.data "password") }}
  password: {{ index $existing.data "password" | b64dec | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hub.postgresName" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "hub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hub.postgresName" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  serviceName: {{ include "hub.postgresName" . }}
  selector:
    matchLabels:
      {{- include "hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The postgres user of the alpine image.
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ $pg.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: harnessly
            - name: POSTGRES_DB
              value: harnessly
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.postgresSecretName" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "harnessly", "-d", "harnessly"]
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "harnessly", "-d", "harnessly"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 4
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.size }}
{{- end }}
