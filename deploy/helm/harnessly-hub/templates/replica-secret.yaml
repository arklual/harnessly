{{- if include "hub.multi" . }}
{{- /* The secret the replicas share for their internal hop: made once, kept across upgrades. */}}
{{- $name := include "hub.replicaSecretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ if $old }}{{ index $old.data "secret" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
{{- end }}
