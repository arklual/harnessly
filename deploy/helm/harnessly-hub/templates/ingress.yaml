{{- if .Values.ingress.enabled }}
{{- $fullName := include "hub.fullname" . }}
{{- $port := .Values.service.port }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ include "hub.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
    {{- with .Values.runtimeDomain }}
    # Each machine at <machine>.<runtimeDomain>.
    - host: {{ printf "*.%s" (trimAll "." . | lower) | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
    {{- end }}
    {{- if and .Values.sitesDomain .Values.sites.enabled }}
    # Each published site at <site>--<space>.<sitesDomain>.
    - host: {{ printf "*.%s" (trimAll "." .Values.sitesDomain | lower) | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
    {{- end }}
{{- end }}
