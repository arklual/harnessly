{{- if include "hub.multi" . }}
{{- /* The replicas' hop: a port of its own, on a Service no Ingress points at; the pods find each other by pod IP. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hub.fullname" . }}-replica
  labels:
    {{- include "hub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: replica
      port: 8041
      targetPort: replica
      protocol: TCP
  selector:
    {{- include "hub.selectorLabels" . | nindent 4 }}
{{- if .Values.networkPolicy.enabled }}
---
{{- /* Anybody the cluster lets in reaches the hub's public port; the replicas' port takes the hub's own pods only. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hub.fullname" . }}-replica
  labels:
    {{- include "hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hub.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: DoesNotExist
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "hub.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: DoesNotExist
      ports:
        - port: replica
          protocol: TCP
    {{- if .Values.metrics.enabled }}
    {{- /* The collector reads the numbers from the pods; metrics.from narrows who may. */}}
    - ports:
        - port: metrics
          protocol: TCP
      {{- with .Values.metrics.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
