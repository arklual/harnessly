{{- /*
Documents (docs.*, the artifacts service) and boards (boards.*, the boards service): each optional, each with a Secret
the chart makes unless existingSecret names one, and, when bundled, a Deployment, a Service and (fs) a volume.
*/}}
{{- range $key := list "docs" "boards" }}
{{- $v := index $.Values $key }}
{{- if $v.enabled }}
{{- $svc := ternary "artifacts" "boards" (eq $key "docs") }}
{{- $name := printf "%s-%s" (include "hub.fullname" $) $svc }}
{{- $secret := include "hub.appSecretName" (dict "root" $ "key" $key) }}
{{- if not $v.existingSecret }}
{{- /* Kept across upgrades, like the Postgres password: what is already there, else a new one. */}}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secret }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{- $data = $existing.data }}{{- end }}
{{- $keys := ternary (list "token" "accessToken") (list "token" "sessionSecret") (eq $key "docs") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
type: Opaque
stringData:
  {{- range $k := $keys }}
  {{- if hasKey $data $k }}
  {{ $k }}: {{ index $data $k | b64dec | quote }}
  {{- else }}
  {{ $k }}: {{ randAlphaNum 48 | quote }}
  {{- end }}
  {{- end }}
---
{{- end }}
{{- if $v.bundled }}
{{- $fs := eq $v.storage.type "fs" }}
{{- /* The hub's page only; machines' origins (runtimeDomain) are the operator's choice, in frameAncestors. */}}
{{- $ancestors := concat (list (include "hub.publicUrl" $)) $v.frameAncestors }}
{{- if $fs }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $v.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $v.storage.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "hub.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
spec:
  # One replica, replaced and not rolled: files on a volume of one node, and the services keep a cache of their own.
  # Several replicas want S3 storage and a service you run yourself (url with bundled: false).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hub.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $svc }}
  template:
    metadata:
      labels:
        {{- include "hub.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $svc }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $svc }}
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          {{- with $v.storage.s3.existingSecret }}
          {{- if not $fs }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            {{- if eq $key "docs" }}
            - name: ARTIFACTS_PORT
              value: "8080"
            - name: ARTIFACTS_PUBLIC_URL
              value: {{ $v.url | trimSuffix "/" | quote }}
            - name: ARTIFACTS_STORAGE
              value: {{ $v.storage.type | quote }}
            - name: ARTIFACTS_DATA_DIR
              value: /data
            - name: ARTIFACTS_AUTH
              value: {{ $v.auth | quote }}
            - name: ARTIFACTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: token
            {{- if eq $v.auth "harnessly" }}
            - name: ARTIFACTS_HARNESSLY_ISSUER
              value: {{ include "hub.publicUrl" $ | quote }}
            - name: ARTIFACTS_HARNESSLY_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: accessToken
            {{- end }}
            - name: ARTIFACTS_FRAME_ANCESTORS
              value: {{ join "," $ancestors | quote }}
            - name: ARTIFACTS_CORS_ORIGINS
              value: {{ include "hub.publicUrl" $ | quote }}
            {{- else }}
            - name: PORT
              value: "8080"
            - name: BOARDS_PUBLIC_URL
              value: {{ $v.url | trimSuffix "/" | quote }}
            - name: BOARDS_STORAGE
              value: {{ $v.storage.type | quote }}
            - name: BOARDS_DATA_DIR
              value: /data
            - name: BOARDS_AUTH
              value: {{ $v.auth | quote }}
            - name: BOARDS_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: token
            - name: BOARDS_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: sessionSecret
            {{- if eq $v.auth "harnessly" }}
            - name: BOARDS_HARNESSLY_ISSUER
              value: {{ include "hub.publicUrl" $ | quote }}
            {{- end }}
            - name: BOARDS_FRAME_ANCESTORS
              value: {{ printf "'self' %s" (join " " $ancestors) | quote }}
            - name: BOARDS_CORS_ORIGINS
              value: {{ include "hub.publicUrl" $ | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if $fs }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
{{- end }}
{{- end }}
{{- end }}
