# The hub keeps each machine's link in the replica the machine dialed. On a SQLite file (the default) it is one replica
# that is replaced, not rolled (strategy: Recreate). On a shared Postgres (database.postgres.enabled, or
# database.external) it runs replicaCount replicas, rolled one at a time: the owner of a link holds a lease with a
# fencing token in the database and the other replicas reach it over an internal hop (docs/hub/replicas.md).

# -- Replicas of the hub. More than one needs Postgres (database.postgres.enabled, or database.external with
# HUB_DATABASE_URL in the Secret) and HUB_SECRET_KEY in the Secret (the data volume is not shared between replicas);
# without a database both are ignored and the hub runs as one replica, as before.
replicaCount: 2

strategy:
  # -- How the Deployment replaces its pods. Empty: RollingUpdate (maxUnavailable 0) with several replicas on a shared
  # Postgres, Recreate otherwise. RollingUpdate asked for on the SQLite file or with one replica is refused: two pods
  # must never open one file, and a single replica has nowhere to move its machines.
  type: ""
  # -- Pods above replicaCount while rolling.
  maxSurge: 1

# With several replicas a pod told to stop first answers «not ready» and keeps serving (settleSeconds, so the
# Service and the ingress stop sending it requests), then asks its machines to dial again one at a time, spread over
# linksSeconds with a random pause, so they do not reach the other replica as a herd. What is left of
# terminationGracePeriodSeconds is for the requests under way. A single replica stops at once: there is nowhere to go.
drain:
  settleSeconds: 5
  linksSeconds: 10

# -- A preStop hook of the hub's container, as Kubernetes writes it (for example {sleep: {seconds: 5}} on 1.30+).
# The hub drains by itself on SIGTERM, so none is needed; the hook's time counts against the grace as well.
preStop: {}

image:
  # -- Image repository. Build the `hub` target of the Dockerfile; the image carries the binaries machines download.
  repository: ghcr.io/ly-solutions/harnessly-hub
  # -- Image tag; defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- The address people use, without a trailing slash (HUB_PUBLIC_URL): what sign-in providers call back, what machines
# dial, what cookies are bound to. Required, e.g. https://hub.example.com. The ingress host is taken from it.
publicUrl: ""
# -- Give every machine an address of its own, <machine>.<runtimeDomain> (HUB_RUNTIME_DOMAIN): needs a wildcard DNS
# record and certificate for *.<runtimeDomain>, which the ingress then routes to the hub. Use a domain of its own, not
# a sibling of the hub's: names under one registrable domain (hub.example.com, m.example.com) are the same site, and a
# browser sends a person's cookies between them (SameSite=Strict does not tell them apart). The hub checks this with
# the public suffix list: a same-site domain is a warning, and edition: cloud does not start with one unless extraEnv
# sets HUB_ALLOW_SAME_SITE_RUNTIME=1. A parent of the hub's host is refused. Required for edition: cloud. Empty serves
# machines at
# <publicUrl>/m/<machine>/ (path mode): then a machine's pages run on the hub's own origin, and only machines you
# trust completely belong there: the hub opens only machines an administrator connected.
runtimeDomain: ""

# -- Published sites (HARNESSLY_SITES_DOMAIN): give every site an address of its own, <site>--<space>.<sitesDomain>. Needs
# a wildcard DNS record and certificate for *.<sitesDomain>, which the ingress then routes to the hub. Use a domain of its
# own, not a sibling of the hub's or of runtimeDomain (the same checks as for runtimeDomain; a parent of the hub's host is
# refused). Empty: a self-hosted hub serves sites under <publicUrl>/sites/<site>--<space>/, static only and sandboxed
# (no allow-same-origin); the cloud edition then has no sites at all.
sitesDomain: ""
sites:
  # -- off turns the feature off whatever the domain (HARNESSLY_SITES).
  enabled: true
  # -- Where the 404 page of the bare sites domain sends a complaint (HARNESSLY_SITES_ABUSE_URL): https:// or mailto:.
  abuseUrl: ""
  # -- Keep the sites' files in an S3-compatible bucket (MinIO, Selectel) instead of the data volume. The keys go in the
  # Secret: HARNESSLY_SITES_S3_ACCESS_KEY and HARNESSLY_SITES_S3_SECRET_KEY.
  s3:
    endpoint: ""
    region: ""
    bucket: ""
    prefix: ""

# -- invite: only the administrators and people with an invitation (HUB_SIGNUP); open: anyone can create an account.
signup: invite
# -- Administrators of the installation (HUB_ADMIN_EMAILS); each must sign in with a verified address. Required while
# the ingress is on (the chart refuses to render otherwise): empty would make the first account to arrive the
# administrator, and with the ingress that can be anyone on the internet.
adminEmails: []
# -- Organizations (HUB_ORGS: off or on). On for a new installation: sign in, make an organization with its first
# tenant, invite people, connect a machine.
orgs: "on"
# -- Flags that are on for every organization that has not chosen (HUB_FEATURES_DEFAULT): ui.hx is the new interface.
featuresDefault: ["ui.hx"]
# -- Let an owner of a space trust a machine to open on the hub's own origin when runtimeDomain is empty
# (HUB_MACHINE_TRUST). Has no effect with runtimeDomain.
machineTrust: true
# -- Take the email of the OpenID Connect providers as verified (HUB_OIDC_EMAIL_TRUSTED): lets the first person to sign in
# through such a provider become the administrator when adminEmails is empty. Only for a provider you run or trust.
oidcEmailTrusted: false
# -- self-hosted or cloud (HUB_EDITION). The cloud edition runs no OpenID Connect and no local machine, needs
# runtimeDomain, and never lets the SSH way reach a private address. It does not start unless orgs is "on" and
# extraEnv sets HUB_ACCESS_ENFORCE=on and HUB_RESOURCE_ACCESS=on.
edition: self-hosted
# -- Sign in with a passkey (HUB_PASSKEY). Needs a domain name in publicUrl.
passkey: true
# -- The name passkeys are bound to (HUB_RP_ID); empty: the host of publicUrl.
rpId: ""
# -- The hub may connect to a server once over SSH to install a machine (HUB_SSH). The key it connects with is the
# space's own (one per space, kept sealed); the owner confirms the server's host key before anything is run.
ssh: true
# -- Let the SSH way reach servers that are not on the public internet: private, loopback and link-local addresses
# (HUB_SSH_ALLOW_PRIVATE). Off by default; turn on only for a hub whose owners all may reach the network it sits in.
# Ignored by the cloud edition.
sshAllowPrivate: false
# -- Offer the «В контейнере» way with this image (HUB_CONTAINER_IMAGE); empty hides it.
containerImage: ""
# -- Refuse agents older than this version (HUB_MIN_AGENT_VERSION).
minAgentVersion: ""
# -- Link to the terms shown at sign-in (HUB_TERMS_URL).
termsUrl: ""
# -- debug, info, warn or error (HUB_LOG_LEVEL).
logLevel: info
# -- Addresses allowed to tell the hub the client's address in X-Forwarded-For (HUB_TRUSTED_PROXIES): the ingress
# controller's pods, as exactly as you can name them (a pod CIDR, not a private range: every pod in the cluster would
# then be believed, and anything that can send the hub a request could pick its own address and slip past the
# per-address limits). Empty trusts nobody: every person then shares the controller's address and its limits, which is
# safe and only clumsy, so set it before real use. The controller sees the person's own address only when its Service
# has externalTrafficPolicy: Local (or the load balancer speaks the PROXY protocol); without that the address in
# X-Forwarded-For is a node's, whatever is trusted.
trustedProxies: ""

# -- Mail for sign-in codes and invitations: the sender (HUB_MAIL_FROM). The server, with its password, is HUB_SMTP_URL
# in the Secret below. Required for an https publicUrl and for edition: cloud: without it the hub does not start (a code
# in a log that others read is a sign-in as anyone), unless extraEnv sets HUB_MAIL_LOG=allow.
mailFrom: ""

# -- off: no sign-in by a mailed code and no SMTP (HUB_AUTH_EMAIL). People sign in through a provider below; an invitation
# is a link the inviter passes on. The hub does not start with off and no provider.
authEmail: "on"

# -- Where the hub keeps its files. type: s3 puts them in one bucket (HUB_STORAGE=s3); the keys go in the Secret:
# HUB_S3_ACCESS_KEY and HUB_S3_SECRET_KEY. Move an existing hub's files with `hub storage migrate`.
storage:
  type: disk
  s3:
    endpoint: ""
    region: ""
    bucket: ""
    prefix: ""

# Sign-in providers. A provider shows up on the sign-in page when its settings are complete; the client secrets are
# keys of the Secret (below), not values.
github:
  # -- GitHub OAuth app client id (HUB_GITHUB_CLIENT_ID); the secret is HUB_GITHUB_CLIENT_SECRET.
  clientId: ""
  # -- Base of a GitHub Enterprise server (HUB_GITHUB_URL); empty: https://github.com.
  url: ""
yandex:
  # -- Yandex ID app client id (HUB_YANDEX_CLIENT_ID); the secret is HUB_YANDEX_CLIENT_SECRET.
  clientId: ""
# -- OpenID Connect providers. The secret of each is HUB_OIDC_<ID>_CLIENT_SECRET in the Secret (ID in capitals).
oidc: []
#  - id: keycloak              # [a-z0-9]+, also in the callback <publicUrl>/api/auth/oauth/keycloak/callback
#    name: Corporate sign-in   # on the button
#    issuer: https://sso.example.com/realms/team
#    clientId: harnessly

# -- A Secret whose keys are read as environment variables of the hub: HUB_DATABASE_URL, HUB_SMTP_URL,
# HUB_GITHUB_CLIENT_SECRET, HUB_YANDEX_CLIENT_SECRET, HUB_OIDC_<ID>_CLIENT_SECRET and HUB_SECRET_KEY (what the SSH keys
# of the spaces are sealed with, `openssl rand -base64 32`; without it the hub makes a key file in the data folder).
# Empty: the chart creates one from `secrets`.
existingSecret: ""
# -- Values for the Secret the chart creates when existingSecret is empty. Keep real secrets out of Git: prefer
# existingSecret (External Secrets, Sealed Secrets, or `kubectl create secret`).
secrets: {}
#  HUB_SMTP_URL: smtp://user:password@mail.example.com:587
#  HUB_GITHUB_CLIENT_SECRET: ""
#  HUB_SECRET_KEY: ""   # at least 32 characters; losing it makes the stored SSH keys useless (they are made again)

# -- More environment for the hub (any HUB_* variable, docs/hub/deploy.md).
extraEnv: []
#  - name: HUB_MIN_AGENT_VERSION
#    value: "1.2.0"
# -- More environment from ConfigMaps or Secrets.
extraEnvFrom: []

database:
  # -- Set when HUB_DATABASE_URL in the Secret points at a Postgres that is not held by this chart: several replicas run
  # on it (replicaCount).
  external: false
  # -- Postgres held in the cluster by this chart: one StatefulSet pod with its own volume, for a try-out or a small
  # team. For anything that matters point HUB_DATABASE_URL (in the Secret) at a database you back up, and leave this
  # off. Off and no HUB_DATABASE_URL: SQLite in the data volume.
  postgres:
    enabled: false
    image: postgres:17-alpine
    size: 5Gi
    storageClass: ""
    # -- The database password; empty: generated once and kept across upgrades.
    password: ""
    # -- A Secret holding the password under the key `password`, instead of the value above.
    existingSecret: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

# Documents and boards are services of their own, each optional (docs/apps/documents.md, docs/apps/boards.md). The hub
# keeps the comments, threads and rights; the documents live in the artifacts service and the boards in the boards
# service. Off by default: a hub without them is complete and has no such app. On, the chart refuses to render until
# the service has an address and, when it runs in this release, a storage.
#
# Documents (HUB_DOCS, the artifacts service).
docs:
  enabled: false
  # -- The public address machines and browsers open the service at (HUB_ARTIFACTS_PUBLIC_URL; https for the apps to frame
  # it), e.g. https://docs.example.com. The hub calls a bundled service inside the cluster and a service of yours here
  # (HUB_ARTIFACTS_URL). Required when enabled.
  url: ""
  # -- Run the service in this release. false: url is a service you run yourself, and existingSecret holds its token.
  bundled: true
  image:
    repository: ghcr.io/ly-solutions/artifacts
    # -- A released version (X.Y.Z) to pin; latest is the newest release.
    tag: latest
  storage:
    # -- fs: files on a volume of its own (one replica); s3: a bucket, its settings in storage.s3.existingSecret.
    # Required when the service runs in this release.
    type: ""
    size: 5Gi
    storageClass: ""
    s3:
      # -- A Secret with the service's S3 variables (ARTIFACTS_S3_BUCKET, ARTIFACTS_S3_ACCESS_KEY_ID,
      # ARTIFACTS_S3_SECRET_ACCESS_KEY, and ARTIFACTS_S3_ENDPOINT/REGION as needed), passed to it as its environment.
      existingSecret: ""
  # -- How people sign in to the service: token (its own tokens and links) or harnessly (the hub's platform token; the
  # service asks the hub for each person's rights with the key accessToken of the Secret).
  auth: token
  # -- Origins besides the hub that may frame documents, e.g. the machines' https://*.<runtimeDomain> when their pages
  # embed it. Any page of such an origin can then frame it.
  frameAncestors: []
  # -- A Secret with the key `token` (what the hub sends the service) and, with auth: harnessly, `accessToken`. Empty:
  # the chart makes one and keeps it across upgrades. Required when bundled is false: the chart cannot know the token
  # of a service it does not run.
  existingSecret: ""
  # -- Route url's host to the bundled service on the hub's Ingress (ingress.enabled); its TLS goes in ingress.tls.
  ingress: true

# Boards (HUB_BOARDS_URL, the boards service).
boards:
  enabled: false
  # -- The public address machines and browsers open the service at (HUB_BOARDS_PUBLIC_URL; https for the apps to frame
  # it), e.g. https://boards.example.com. The hub calls a bundled service inside the cluster and a service of yours here
  # (HUB_BOARDS_URL). Required when enabled.
  url: ""
  # -- Run the service in this release. false: url is a service you run yourself, and existingSecret holds its token.
  bundled: true
  image:
    repository: ghcr.io/ly-solutions/boards
    # -- A released version (X.Y.Z) to pin; latest is the newest release.
    tag: latest
  storage:
    # -- fs: files on a volume of its own (one replica); s3: a bucket, its settings in storage.s3.existingSecret.
    # Required when the service runs in this release.
    type: ""
    size: 1Gi
    storageClass: ""
    s3:
      # -- A Secret with the service's S3 variables (BOARDS_S3_BUCKET, BOARDS_S3_ACCESS_KEY_ID,
      # BOARDS_S3_SECRET_ACCESS_KEY, and BOARDS_S3_ENDPOINT/REGION as needed), passed to it as its environment.
      existingSecret: ""
  # -- How people sign in to the service: token (its own tokens) or harnessly (the hub's platform token; needs a boards
  # release that has it).
  auth: token
  # -- Origins besides the hub that may frame the editor, e.g. the machines' https://*.<runtimeDomain> when their pages
  # embed it. Any page of such an origin can then frame it.
  frameAncestors: []
  # -- A Secret with the key `token` (what the hub sends the service) and `sessionSecret` (the service's cookies).
  # Empty: the chart makes one and keeps it across upgrades. Required when bundled is false.
  existingSecret: ""
  # -- Route url's host to the bundled service on the hub's Ingress (ingress.enabled); its TLS goes in ingress.tls.
  ingress: true

persistence:
  # -- The hub's data folder (HUB_DATA_DIR): the SQLite file and, unless HUB_SECRET_KEY is set, the key file that seals
  # the SSH keys of the spaces. With Postgres and ssh: false (or HUB_SECRET_KEY set) it holds nothing and can be off.
  enabled: true
  size: 5Gi
  # -- StorageClass; empty uses the cluster's default.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

networkPolicy:
  # -- With several replicas: a NetworkPolicy that lets only the hub's own pods reach the port the replicas talk on
  # (8041); the public port stays open as the cluster has it. Needs a network plugin that enforces policies.
  enabled: true

metrics:
  # -- Serve the hub's numbers in the Prometheus text format at /metrics, on a port of its own that is on no Service
  # and no Ingress, and annotate the pods (prometheus.io/scrape, port, path) for a collector that finds pods by
  # annotation. The numbers are counts only (links, queues, requests by route group), without names or addresses,
  # and are served without sign-in to whoever reaches the port inside the cluster.
  enabled: true
  port: 8042
  # -- Who may reach the port when the NetworkPolicy above is on: a list of NetworkPolicy peers, for example
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]. Empty: any pod of the cluster.
  from: []

ingress:
  enabled: false
  className: ""
  # -- Terminals and conversations are WebSockets that stay open: raise the proxy's timeouts (nginx shown; other
  # controllers have their own settings).
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # -- TLS secrets. The hub host and, with runtimeDomain, the wildcard *.<runtimeDomain> (its own certificate).
  tls: []
  #  - secretName: harnessly-hub-tls
  #    hosts: [hub.example.com]
  #  - secretName: harnessly-hub-machines-tls
  #    hosts: ["*.run.example.net"]

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # -- The hub does not talk to the cluster; leave the API token out.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 10002
  runAsGroup: 10002
  runAsNonRoot: true
  fsGroup: 10002
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi

# Up to a minute for a migration on a large database before the first answer.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 3
  failureThreshold: 20
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
# The readiness probe asks the database too: a hub that cannot reach it leaves the Service.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 4
  failureThreshold: 3

# -- Seconds the pod has to stop. One replica needs up to 20; several replicas need more than drain.settleSeconds +
# drain.linksSeconds + 5 (the chart refuses less) and get the rest for the requests under way.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
# -- The pod's affinity, as Kubernetes writes it. When set it replaces the rules of antiAffinity below.
affinity: {}

antiAffinity:
  # -- Keep the hub's pods apart from each other (several replicas) and from the pod of the bundled Postgres
  # (database.postgres.enabled), so losing a node does not take both. Nothing is added for one replica on SQLite.
  enabled: true
  # -- false: a preference, so a cluster of one node still schedules. true: a pod that cannot be kept apart stays
  # Pending.
  required: false
  topologyKey: kubernetes.io/hostname
