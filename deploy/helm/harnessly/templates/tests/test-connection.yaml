apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "harnessly.fullname" . }}-test"
  labels:
    {{- include "harnessly.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "harnessly.fullname" . }}:{{ .Values.service.port }}{{ include "harnessly.healthPath" . }}"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
