{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harnessly.fullname" . }}
  labels:
    {{- include "harnessly.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secrets }}
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
