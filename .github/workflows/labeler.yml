# Labels a pull request by the areas it touches (.github/labeler.yml). pull_request_target so that pull requests from
# forks get labels too; the job never checks out or runs the pull request's code.
name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
