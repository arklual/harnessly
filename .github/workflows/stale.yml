# Issues and pull requests with no activity for 60 days get a note, and close 14 days later unless someone answers.
# Bugs that are confirmed, security reports and anything pinned are never marked.
name: stale

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,confirmed,help wanted,good first issue
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has had no activity for 60 days. If it still matters, leave a comment and it stays open;
            otherwise it closes in 14 days.
          stale-pr-message: >
            This pull request has had no activity for 60 days. Push or comment to keep it open; otherwise it closes in
            14 days.
          close-issue-reason: not_planned
