name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The tests that drive these tools skip themselves without them; installed, nearly the whole suite runs.
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tmux git unzip ffmpeg >/dev/null
      - run: go mod download
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: Build for macOS
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/...
      - run: go test -race -count=1 ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Built from source at a pinned version, checked against the Go checksum database.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the tree
        run: "$(go env GOPATH)/bin/gitleaks dir . --no-banner --redact"
