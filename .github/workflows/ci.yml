name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The tests that drive these tools skip themselves without them; installed, nearly the whole suite runs.
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tmux git unzip ffmpeg >/dev/null
      - run: go mod download
      - run: make fmt-check
      - run: make vet
      # The runner has Chrome: the agent browser tests must run here, not skip (our GitLab runners have none).
      - run: make test-race
        env:
          HARNESSLY_REQUIRE_CHROME: "1"

  # The server safe's client (internal/secrets/vaultkv) against both servers it promises to speak to, in dev mode:
  # KV v1 and v2, a token and AppRole under a narrow policy. The rest of the suite uses a fake of the API.
  vault-compat:
    name: vault-compat ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - { name: openbao, image: "openbao/openbao:2.3.1" }
          - { name: vault, image: "hashicorp/vault:1.20.0" }
    env:
      GOFLAGS: -mod=readonly
      VAULTKV_TEST_ADDR: http://127.0.0.1:8200
      VAULTKV_TEST_ROOT_TOKEN: dev-root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start ${{ matrix.server.name }} in dev mode
        run: |
          docker run -d --name kv --cap-add=IPC_LOCK -p 8200:8200 "${{ matrix.server.image }}" \
            server -dev -dev-root-token-id=dev-root -dev-listen-address=0.0.0.0:8200
          for _ in $(seq 60); do curl -sf "$VAULTKV_TEST_ADDR/v1/sys/health" >/dev/null && exit 0; sleep 1; done
          docker logs kv; exit 1
      - run: go test -count=1 -run Real -v ./internal/secrets/vaultkv

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compile every package
        run: go build ./...
      - name: Build the binaries
        run: go build -trimpath -o bin/ ./cmd/...

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The runtime carries the page it was built next to: the compiled-in files are the agents workspace.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Runtime with the page compiled in
        working-directory: .
        run: |
          go test -tags webui -count=1 -run TestWebUIBuild ./cmd/runtime
          go build -tags webui -o "$RUNNER_TEMP/runtime" ./cmd/runtime
          RUNTIME_GATE_LISTEN=127.0.0.1:8022 RUNTIME_GATE_UPSTREAM= RUNTIME_APP_BASE_PATH=/ HOME="$RUNNER_TEMP/home" \
            "$RUNNER_TEMP/runtime" &
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8022/api/health >/dev/null && break; sleep 1; done
          page=$(curl -fsS 127.0.0.1:8022/)
          echo "$page" | grep -q '<title>harnessly'
          bundle=$(echo "$page" | grep -o 'assets/index-[^"]*\.js' | head -n1)
          curl -fsS "127.0.0.1:8022/$bundle" >/dev/null
          kill %1

  deploy:
    name: deploy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Helm chart
        run: |
          helm lint --strict deploy/helm/harnessly
          helm template ci deploy/helm/harnessly > /dev/null
          helm template ci deploy/helm/harnessly --set ingress.enabled=true --set persistence.enabled=false \
            --set integrations.boards.url=https://boards.example.com --set existingSecret=s > /dev/null
      - name: Hub Helm chart
        run: |
          helm lint --strict deploy/helm/harnessly-hub -f deploy/helm/harnessly-hub/ci/minimal-values.yaml
          helm lint --strict deploy/helm/harnessly-hub -f deploy/helm/harnessly-hub/ci/full-values.yaml
          helm template ci deploy/helm/harnessly-hub -f deploy/helm/harnessly-hub/ci/minimal-values.yaml > /dev/null
          helm template ci deploy/helm/harnessly-hub -f deploy/helm/harnessly-hub/ci/full-values.yaml > /dev/null
      - name: Compose file
        run: |
          docker compose config --quiet
          docker compose -f compose.hub.yaml config --quiet
      - name: Image
        run: docker build --target runtime -t harnessly:ci .
      - name: Hub and machine images
        run: |
          docker build --target hub -t harnessly-hub:ci .
          docker build --target machine -t harnessly-machine:ci .
      - name: Image answers
        run: |
          docker run -d --name hs -p 127.0.0.1:8022:8022 harnessly:ci
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8022/api/health && break; sleep 1; done
          curl -fsS 127.0.0.1:8022/ | grep -q '<title>harnessly'
          docker rm -f hs

  # The vendored agent skills (skills/upstream) must be the files of the commits pinned in skills/SOURCES.
  skills:
    name: vendored skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make skills-check

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Built from source at a pinned version, checked against the Go checksum database.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the tree
        run: '"$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact'

  hub-e2e:
    name: hub end to end
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tmux git jq >/dev/null
      # A hub, a machine agent and its runtime on this host: sign-up, a registration code, the machine online with its
      # preflight, keys sealed to the machine, the machine's page through the hub, policy and kill switch, revoke.
      - name: Pages
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: tools/hub-e2e.sh

  browser-install:
    name: fresh browser install (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      # The checkout belongs to another user than the container's root, so git refuses to answer for VCS stamping.
      GOFLAGS: -buildvcs=false
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12"]
    steps:
      - name: Bootstrap clean container
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl git tar make gcc libc6-dev python3 procps
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and install this branch
        run: |
          mkdir -p /tmp/browser-release
          go build -o /tmp/browser-release/runtime ./cmd/runtime
          go build -o /tmp/browser-release/agent ./cmd/agent
          go build -o /tmp/browser-release/harnessly ./cmd/harnessly
          tar -czf /tmp/browser-release.tar.gz -C /tmp/browser-release runtime agent harnessly
          sh install.sh --archive /tmp/browser-release.tar.gz --prefix /opt/browser-test --no-service
          go test -c -o /tmp/browser-test ./internal/agentbrowser
          useradd --create-home browser-test
      - name: Download Chrome and capture a real frame
        # Container kernels may deny user namespaces. This explicit choice matches Dockerfile, never host defaults.
        env:
          RUNTIME_BROWSER_CHROME_ARGS: --no-sandbox
        run: |
          su -s /bin/sh browser-test -c 'python3 tools/browser-install-smoke.py \
            --runtime /opt/browser-test/bin/harnessly-runtime --test-binary /tmp/browser-test'
