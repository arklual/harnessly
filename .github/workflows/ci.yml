name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The tests that drive these tools skip themselves without them; installed, nearly the whole suite runs.
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tmux git unzip ffmpeg >/dev/null
      - run: go mod download
      - run: make fmt-check
      - run: make vet
      - run: make test-race

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compile every package
        run: go build ./...
      - name: Build the binaries
        run: go build -trimpath -o bin/ ./cmd/...

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The runtime carries the page it was built next to: the compiled-in files are the agents workspace.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Runtime with the page compiled in
        working-directory: .
        run: |
          go test -tags webui -count=1 -run TestWebUIBuild ./cmd/runtime
          go build -tags webui -o "$RUNNER_TEMP/runtime" ./cmd/runtime
          RUNTIME_GATE_LISTEN=127.0.0.1:8022 RUNTIME_GATE_UPSTREAM= RUNTIME_APP_BASE_PATH=/ HOME="$RUNNER_TEMP/home" \
            "$RUNNER_TEMP/runtime" &
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8022/api/health >/dev/null && break; sleep 1; done
          page=$(curl -fsS 127.0.0.1:8022/)
          echo "$page" | grep -q '<title>harnessly'
          bundle=$(echo "$page" | grep -o 'assets/index-[^"]*\.js' | head -n1)
          curl -fsS "127.0.0.1:8022/$bundle" >/dev/null
          kill %1

  deploy:
    name: deploy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Helm chart
        run: |
          helm lint --strict deploy/helm/harnessly
          helm template ci deploy/helm/harnessly > /dev/null
          helm template ci deploy/helm/harnessly --set ingress.enabled=true --set persistence.enabled=false \
            --set integrations.boards.url=https://boards.example.com --set existingSecret=s > /dev/null
      - name: Compose file
        run: docker compose config --quiet
      - name: Image
        run: docker build --target runtime -t harnessly:ci .
      - name: Image answers
        run: |
          docker run -d --name hs -p 127.0.0.1:8022:8022 harnessly:ci
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8022/api/health && break; sleep 1; done
          curl -fsS 127.0.0.1:8022/ | grep -q '<title>harnessly'
          docker rm -f hs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Built from source at a pinned version, checked against the Go checksum database.
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the tree
        run: '"$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact'
