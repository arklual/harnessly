name: Bug report
description: Something in the runtime or the machine agent does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Security problems go through private reporting (the **Security** tab),
        not here. Please leave secrets, tokens and private paths out of logs you paste.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - runtime (cmd/runtime)
        - web page (web/)
        - machine agent (cmd/agent)
        - harnessly CLI (cmd/harnessly)
        - agentprobe (cmd/agentprobe)
        - deploy (Docker, compose, Helm, Argo CD, systemd)
        - build, CI or docs
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      description: Standalone when `RUNTIME_GATE_UPSTREAM` is empty, gate when it points at a previous runtime.
      options:
        - standalone
        - gate
        - not applicable
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or requests that shows the problem.
      placeholder: |
        1. HOME=$(mktemp -d) RUNTIME_GATE_LISTEN=127.0.0.1:4321 ./bin/runtime
        2. curl -s 127.0.0.1:4321/api/...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The JSON log lines around the problem. They are rendered as code.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "`curl -s 127.0.0.1:<port>/api/health`, the release tag, or `git rev-parse --short HEAD`."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and architecture, Go version when built from source, tmux version, Claude Code / Codex versions when relevant.
      placeholder: "linux/amd64, go1.26.5, tmux 3.5a, Claude Code 2.x"
