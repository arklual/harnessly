id: connector-calendar
title: Календарь коннектора — свободные окна и встречи через harnessly connector, перенос только карточкой
tags: [connectors]
timeout_s: 300
covers:
  - 'internal/connectors/caldav/**'
  - 'internal/connectors/connector.go'
  - 'internal/connectors/actions.go'
prompt: когда у меня завтра свободно на час? и перенеси мой созвон с Аней на это время
expect:
  - name: read the calendar through harnessly
    called: Bash
    args: {command: 'harnessly connector(s| read| act)(?s:.*)'}
  - name: did not go around the runtime to the calendar server
    not_called: Bash
    args: {command: '(?s:.*)(curl|wget|python)(?s:.*)(caldav|\.ics|calendar)(?s:.*)'}
  - name: did not ask for a password in the chat
    text_not: '(?i)(пришли|вставь|скинь|дай|send|paste)\S*\s+(мне\s+)?(пароль|password|токен|token)'
