id: design-board-opened
title: Новая доска Sinopia — открыта человеку именно она
tags: [design, pane]
timeout_s: 600
setup:
  design: [fixtures/shop]
covers:
  - 'cmd/runtime/agent_skills*.go'
  - 'skills/upstream/agent-skills/plugins/harnessly/**'
  - 'internal/hlcli/hlcli.go'
  - 'internal/hlcli/preview.go'
  - 'internal/paneintents/**'
  - 'internal/hlcli/design*.go'
  - 'internal/design/**'
prompt: Сделай в проекте Sinopia Design «shop» новую доску «Оплата» — форма оплаты заказа с суммой и кнопкой «Оплатить». Покажи мне её, когда будет готово.
expect:
  - name: the board exists
    file: {glob: 'design:shop/project/*.dc.html', contains: 'Оплатить'}
  - name: opened the design on that board
    pane: {tab: design, target: shop, place: '(?i)оплат'}
  - name: payment board renders on desktop and phone without browser errors
    check: |
      python3 -I - <<'PY'
      import json, os, pathlib, subprocess
      project = pathlib.Path(os.environ['TMPDIR']).parent / 'design/shop/project'
      boards = [p for p in project.glob('*.dc.html') if 'оплат' in p.name.lower()]
      assert len(boards) == 1, 'expected one payment board'
      env = dict(os.environ, HARNESSLY_DATA_DIR=str(pathlib.Path(os.environ['TMPDIR']).parent / 'data'))
      result = subprocess.run(['harnessly', '--json', 'design', 'check', 'shop', '--board', boards[0].name], capture_output=True, text=True, timeout=90, env=env)
      assert result.returncode == 0, result.stderr
      report = json.loads(result.stdout)
      assert report.get('finished') and not report.get('failure'), report
      checked = report.get('boards') or []
      assert len(checked) == 1, report
      shots = checked[0].get('shots') or []
      assert {s['view'] for s in shots} == {'desktop', 'phone'}, checked
      for shot in shots:
          assert shot['status'] == 'ok' and not shot.get('errors') and not shot.get('failedRequests'), shot
          assert shot.get('screenshot') and pathlib.Path(shot['screenshot']).is_file(), shot
      PY
variants:
  - id: v1
    kind: short
    text: "Sinopia Design, «shop»: новая доска «Оплата», форма оплаты заказа с суммой и кнопкой «Оплатить». Покажи, когда будет готово."
  - id: v2
    kind: long
    text: "Слушай, в проекте Sinopia Design, в части «shop», нам не хватает отдельной доски «Оплата». Там должна быть форма оплаты заказа с суммой и кнопкой «Оплатить». Очень нужно, чтобы она появилась, так что как только будет готово, покажи мне её."
  - id: v3
    kind: typos
    text: "в проекте sinopia desgin в части «shop» новую дксу «оплата» форма оплаты заказа с суммой и кнопкой «оплатить» покажы мне её как будет готово"
  - id: v4
    kind: english
    text: "In the Sinopia Design project, in «shop», add a new board «Оплата»: an order payment form with an amount field and an «Оплатить» button. Show it to me when it's ready."
  - id: v5
    kind: formal
    text: "Будьте добры, в проекте Sinopia Design в разделе «shop» создайте, пожалуйста, новую доску «Оплата» — форму оплаты заказа с указанием суммы и кнопкой «Оплатить». Покажите её мне, пожалуйста, по готовности."
  - id: v6
    kind: indirect
    text: "В проекте Sinopia Design, в разделе «shop», мне нужна ещё одна доска под названием «Оплата»: экран, где клиент видит сумму заказа и жмёт «Оплатить». Как только всё будет на месте, дай знать и покажи."
