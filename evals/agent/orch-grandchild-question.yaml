id: orch-grandchild-question
title: Подчат подчата спрашивает человека — вопрос поднимается в главный чат (HRN-1634)
tags: [orchestration, delegation, hard]
agents: [claude, codex]
timeout_s: 900
settle_s: 90
setup:
  workspace: [fixtures/orch-ask]
  run: git init -q && git add -A && git -c user.name=eval -c user.email=eval@example.test commit -qm init
covers:
  - 'cmd/runtime/agent_skills*.go'
  - 'cmd/runtime/v2_notice*.go'
  - 'skills/upstream/agent-skills/plugins/harnessly/**'
  - 'internal/delegation/**'
  - 'internal/mcpserver/**'
  - 'internal/push/**'
# Nobody answers in a run: when every chat waits for the person there is nothing to interrupt, and that wait is the
# point — the question asked two levels down must be put to the person in the chat they sit in, not stay below.
prompt: |-
  Поручи помощнику в отдельном чате, а он пусть поручит ещё одному агенту в отдельном чате: создать в этой папке файл greeting.txt с одной строкой приветствия гостям на языке, который выберу я. Язык у меня спросит тот, кто будет писать файл, — ни ты, ни помощник его не выбирайте и не угадывайте. Я сижу в этом чате; отвечу здесь, когда меня спросят.
expect:
  - name: delegated to a chat
    any_of:
      - called: harnessly\.delegate_task
      - called: Bash
        args: {command: '(?s).*harnessly tab create\b.*--prompt.*'}
  # Said holds the root chat's words only: it tells the person that the writer asks now (not «will ask»), with the
  # question itself or the chat it waits in.
  - name: the person's chat says the writer asks for the language
    text: '(?is)(спрашивает|задаёт).{0,160}язык|язык[^\n]{0,80}ждёт'
  - name: nobody chose the language for the person
    check: test ! -e greeting.txt
