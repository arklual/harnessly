# Code Mode of Claude Code: the REPL tool, consent given in ~/.claude.json as after the opt-in dialog.
name: code-mode
runtime_env:
  RUNTIME_GITLAB_HOSTS: gitlab.example.test
  RUNTIME_TRACKER_HOSTS: tracker.example.test
  RUNTIME_TASK_KEY_RE: '\b(?:PRJ|OPS)-\d+\b'
  RUNTIME_TASK_EXAMPLES: PRJ-128
  RUNTIME_STAND_DOMAIN: .preview.example.test
  RUNTIME_DOCS_HOST: docs.example.test
agent_env:
  CLAUDE_CODE_EXPERIMENTAL_CODE_MODE: "1"
claude_config:
  codeModeCaveatsAcceptedV1: true
  codeModeAutoModeCaveatAcceptedV1: true
