# Arm of the orchestration comparison: the work is handed to Claude Code subagents (Agent tool).
name: orch-subagents
runtime_env:
  RUNTIME_GITLAB_HOSTS: gitlab.example.test
  RUNTIME_TRACKER_HOSTS: tracker.example.test
  RUNTIME_TASK_KEY_RE: '\b(?:PRJ|OPS)-\d+\b'
  RUNTIME_TASK_EXAMPLES: PRJ-128
  RUNTIME_STAND_DOMAIN: .preview.example.test
  RUNTIME_DOCS_HOST: docs.example.test
agent_env: {}
prompt_suffix: Помощников заводи сабагентами Claude Code (тул Agent); подчаты harnessly и команды агентов не используй.
