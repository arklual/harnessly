# Verify on merge requests and main; on a version tag, build the binaries and publish them to this project's
# generic package registry as agent/<tag>/<binary>-<os>-<arch> (binary: agent, harnessly, runtime) with a SHA256SUMS file.
# The runtime is built with the web page compiled in (the webui tag); in front of a previous runtime (gate mode) it
# serves the page only with RUNTIME_WEB=on, so machines that run it that way see no change.
# RUNNER_TAG is a project CI/CD variable: which runners take the jobs is the deployment's business, not the code's.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$/'
    - when: never

default:
  image: docker.io/golang:1.26.5-bookworm
  tags: [$RUNNER_TAG]

variables:
  GOFLAGS: -mod=readonly
  GOMODCACHE: $CI_PROJECT_DIR/.cache/mod
  GOCACHE: $CI_PROJECT_DIR/.cache/build

cache:
  key: go-$CI_COMMIT_REF_SLUG
  paths: [.cache/]

stages: [verify, build]

verify:
  stage: verify
  script:
    - command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip >/dev/null) || true
    - go mod download
    - test -z "$(gofmt -l cmd internal)"
    - go vet ./...
    - GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/...
    - go test -race -count=1 ./...

# The same linter and version as the public GitHub CI (.github/workflows/lint.yml), so its main stays green.
golangci:
  stage: verify
  variables:
    GOLANGCI_LINT_VERSION: "2.15.0"
  script:
    - curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
    - /tmp/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint run ./...

web:
  stage: verify
  image: docker.io/node:22-bookworm
  cache:
    key: web-$CI_COMMIT_REF_SLUG
    paths: [.cache/pnpm/]
  before_script:
    - corepack enable
    - cd web
    - pnpm config set store-dir "$CI_PROJECT_DIR/.cache/pnpm"
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm typecheck
    - pnpm test
    - pnpm build

web-dist:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
  image: docker.io/node:22-bookworm
  cache:
    key: web-$CI_COMMIT_REF_SLUG
    paths: [.cache/pnpm/]
    policy: pull
  script:
    - corepack enable
    - cd web
    - pnpm config set store-dir "$CI_PROJECT_DIR/.cache/pnpm"
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths: [web/dist/]
    expire_in: 1 day

build:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
  needs: [web-dist]
  script:
    - test -f web/dist/index.html
    - go test -tags webui -count=1 -run TestWebUIBuild ./cmd/runtime
    - mkdir -p dist
    - |
      for target in linux/amd64 linux/arm64 darwin/arm64; do
        os=${target%/*}; arch=${target#*/}
        for bin in agent harnessly runtime; do
          tags=""
          [ "$bin" = runtime ] && tags="-tags webui"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath $tags \
            -ldflags "-s -w -X github.com/ly-solutions/harnessly/internal/agent.BuildVersion=${CI_COMMIT_TAG#v} -X github.com/ly-solutions/harnessly/internal/hlcli.Version=${CI_COMMIT_TAG#v}" \
            -o "dist/$bin-$os-$arch" ./cmd/$bin
        done
      done
    - (cd dist && sha256sum agent-* harnessly-* runtime-* > SHA256SUMS)
    - |
      for f in dist/*; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent/${CI_COMMIT_TAG#v}/$(basename "$f")"
      done
  artifacts:
    paths: [dist/]
